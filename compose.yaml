services:
  wiki:
    build: .
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 43171
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in private env file}
      DISABLE_LOCAL_LOGIN: "1"
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_CRED_KEY: ${EMAIL_CRED_KEY:-}
      VK_BOT_AUTH_TOKEN: ${VK_BOT_AUTH_TOKEN:-}
      VK_API_BASE: ${VK_API_BASE:-}
      PORTAL_EMAIL_DOMAIN: ${PORTAL_EMAIL_DOMAIN:-}
      VK_BOT_AUTH_NAME: ${VK_BOT_AUTH_NAME:-}
      VK_BOT_AUTH_ID: ${VK_BOT_AUTH_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ru}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SSL_TLS: ${SMTP_SSL_TLS:-true}
    ports:
      - "127.0.0.1:43171:43171"
    volumes:
      - wiki-data:/app/.local
    healthcheck:
      test: ["CMD", "node", "lib/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  wiki-data:
