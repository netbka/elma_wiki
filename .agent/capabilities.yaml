  storybook-system:
    owners: ["storybook/", "web/flows/", "web/flows.html", "lib/flow-reviews.mjs", "testing/workflows/"]
    routes: ["docs/STORYBOOK.md", "docs/EXPERIENCE_REVIEW.md"]
    boundaries: ["tooling", "ui", "domain", "storage"]
  agent-system:
    owners: ["AGENTS.md", "CLAUDE.md", ".agent/capabilities.yaml", "docs/INDEX.md", "docs/PRODUCT_DIRECTION.md", "docs/SOLUTION_FIRST_PRODUCT_PLAN.md", "docs/SOLUTION_FIRST_EXECUTION.md", "docs/SOLUTION_FIRST_CONTRADICTIONS.md", "docs/workflows/agent-execution.md", "tools/agent-workflow.mjs", "test/agent-workflow.test.mjs", ".github/pull_request_template.md", "verify.mjs"]
    routes: ["AGENTS.md", "docs/SOLUTION_FIRST_PRODUCT_PLAN.md", "docs/SOLUTION_FIRST_EXECUTION.md", "docs/SOLUTION_FIRST_CONTRADICTIONS.md", "docs/workflows/agent-execution.md", "docs/INDEX.md"]
    boundaries: ["tooling"]
  operations:
    owners: ["deploy/", "compose.yaml", "Dockerfile", "tools/prod-update.mjs", "test/prod-update.test.py"]
    routes: ["deploy/README.md", "docs/runbooks/target-deployment.md"]
    boundaries: ["ops", "security", "tooling"]
  analyst-release-planning:
    owners: ["docs/plans/analyst-release-workspace.md", "docs/audits/analyst-release-audit-brief.md"]
    routes: ["docs/plans/analyst-release-workspace.md", "docs/audits/analyst-release-audit-brief.md", "docs/plans/source-target-e2e.md"]
    boundaries: ["content"]
