version: 1
classification:
  intents:
    investigate: "inspect/reproduce/explain; no runtime change"
    design: "define product/architecture/visible result"
    change: "implement or repair assigned outcome"
    verify: "test/review existing work"
    operate: "connect/deploy/rollback or other environment operation"
  boundaries:
    ui: "visible layout/state/interaction"
    domain: "project/snapshot/workspace/candidate behavior"
    storage: "private project artifacts, persistence, ownership"
    parser: ".e365 interpretation and coverage"
    connection: "Source/Target/bridge protocol"
    compiler: "typings, compile, lint, package build"
    security: "identity, authorization, credentials, private data"
    ops: "live environment/deployment/rollback"
    tooling: "Storybook, agent docs, build/test tooling"
    content: "public/product/documentation wording"
capabilities:
  bug-reports:
    owners: ["lib/bug-reports.mjs", "lib/github-api.mjs", "web/feedback/", "web/bug-reports.html", "storybook/stories/BugReports.stories.js", "test/bug-reports.test.mjs", "tools/bug-reports-browser-check.mjs", "server.mjs"]
    routes: ["docs/contracts/bug-reports.md", "docs/SOLUTION_FIRST_PRODUCT_PLAN.md", "docs/contracts/shared-solutions.md"]
    boundaries: ["ui", "domain", "storage", "security", "connection", "tooling"]
  solution-visual:
    owners: ["lib/solution-visual.mjs", "web/visual/", "storybook/stories/SolutionVisual.stories.js", "test/solution-visual.test.mjs", "tools/solution-visual-browser-check.mjs"]
    routes: ["docs/contracts/solution-visual.md", "docs/SOLUTION_FIRST_PRODUCT_PLAN.md", "docs/contracts/shared-solutions.md"]
    boundaries: ["ui", "parser", "security", "domain", "tooling"]
  shared-solutions:
    owners: ["lib/solutions.mjs", "lib/actors.mjs", "lib/managed-workspace-store.mjs", "server.mjs", "test/solutions-api.test.mjs"]
    routes: ["docs/contracts/shared-solutions.md", "docs/SOLUTION_FIRST_PRODUCT_PLAN.md", "docs/SOLUTION_FIRST_CONTRADICTIONS.md"]
    boundaries: ["domain", "storage", "security"]
  managed-workspace:
    owners: ["lib/managed-workspace.mjs", "lib/process-elements.mjs", "lib/managed-workspace-store.mjs", "server.mjs", "test/managed-workspace.test.mjs", "test/process-elements.test.mjs", "test/managed-workspace-store.test.mjs", "test/managed-workspace-api.test.mjs"]
    routes: ["docs/contracts/managed-workspace.md", "docs/contracts/project-snapshots.md"]
    boundaries: ["domain", "parser", "storage", "security"]
  managed-workspace-ui:
    owners: ["web/managed/", "web/solutions.html", "web/workspaces.html", "storybook/stories/ManagedWorkspace.stories.js", "test/managed-workspace-view.test.mjs", "tools/managed-workspace-browser-check.mjs"]
    routes: ["docs/SOLUTION_FIRST_PRODUCT_PLAN.md", "docs/workflows/solutions.md", "docs/contracts/shared-solutions.md", "docs/contracts/managed-workspace.md", "docs/STORYBOOK.md"]
    boundaries: ["ui", "domain", "security", "tooling"]
  request-bot:
    owners: ["services/request-bot/", "lib/request-coordinator.mjs", "web/requests/", "web/requests.html", "storybook/stories/PortalRequests.stories.js", ".github/workflows/request-bot.yml"]
    routes: ["docs/contracts/request-bot.md", "docs/contracts/portal-requests.md", "services/request-bot/README.md", "docs/plans/vk-teams-agent-delivery.md"]
    boundaries: ["domain", "storage", "security", "connection", "tooling", "ops"]
  analyst-releases:
    owners: ["lib/releases.mjs", "lib/solutions.mjs", "web/releases/", "web/releases.html", "test/releases.test.mjs", "test/solution-handoffs.test.mjs", "tools/solution-handoff-browser-check.mjs"]
    routes: ["docs/contracts/analyst-releases.md", "docs/workflows/analyst-release.md", "docs/plans/analyst-release-investigation.md"]
    boundaries: ["ui", "domain", "storage", "security", "tooling"]
  authentication:
    owners: ["lib/auth.mjs", "lib/vk-teams.mjs", "lib/email.mjs", "lib/service-config.mjs", "server.mjs", "web/login.html", "web/service.js"]
    routes: ["README.md", "testing/workflows/vk-login.json", "testing/workflows/email-login.json"]
    boundaries: ["security", "ui"]
  public-site:
    owners: ["web/index.html", "web/service.css", "web/service.js", "web/public.js", "web/public.css", "web/public-article-sources.mjs", "lib/public-site.mjs", "tools/build-public.mjs", "vercel.json"]
    routes: ["docs/PUBLIC_DEPLOYMENT.md", "docs/INDEX.md", "docs/workflows/public-article-sources.md"]
    boundaries: ["ui", "content"]
  projects:
    owners: ["lib/projects.mjs", "lib/store.mjs", "server.mjs", "web/dashboard.html"]
    routes: ["docs/contracts/project-snapshots.md"]
    boundaries: ["domain", "storage", "security"]
  e365-parser:
    owners: ["lib/e365.mjs", "lib/project-parser.mjs"]
    routes: ["docs/E365_FILE_PROJECTS.md", "docs/contracts/project-snapshots.md"]
    boundaries: ["parser", "security"]
  object-search:
    owners: ["dist/object-search.js", "web/public-field-guide.mjs", "storybook/stories/ObjectSearch.stories.js", "test/object-search.test.mjs", "tools/first-use-browser-check.mjs"]
