name: Request bot contracts
on:
  pull_request:
    paths:
      - 'services/request-bot/**'
      - '.github/workflows/request-bot.yml'
  push:
    branches: [main]
    paths:
      - 'services/request-bot/**'
      - '.github/workflows/request-bot.yml'
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Contracts, recovery and HTTP authorization
        working-directory: services/request-bot
        run: npm test
      - name: Explicitly synthetic conversation demo
        working-directory: services/request-bot
        run: npm run demo
