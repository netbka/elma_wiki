name: Verify service
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:editor
      - name: Unit and contract tests
        timeout-minutes: 5
        run: npm test
      - run: npm run verify
      - run: node tools/check-flow-catalog.mjs
      - run: npm ci --prefix storybook
      - run: npm run build:storybook
      - name: Prepare browser
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - if: runner.os == 'Linux'
        run: npm run test:releases:browser
      - if: runner.os == 'Linux'
        run: npm run test:delivery:browser
      - if: runner.os == 'Linux'
        run: npm run test:managed:browser
      - if: runner.os == 'Linux'
        run: npm run test:handoff:browser
      - if: runner.os == 'Linux'
        run: node tools/requests-browser-check.mjs
      - if: runner.os == 'Linux'
        run: node tools/solution-visual-browser-check.mjs
      - if: runner.os == 'Linux'
        run: node tools/vk-auth-browser-check.mjs
      - if: runner.os == 'Linux'
        run: npm run test:public:browser
      - if: runner.os == 'Linux'
        run: node tools/public-field-guide-visual-check.mjs
      - if: runner.os == 'Linux'
        run: node tools/first-use-browser-check.mjs
      - name: Retain synthetic public visual evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-visual-evidence
          path: |
            qa/public-*.png
            qa/public-field-guide-visual-evidence.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain synthetic managed workspace evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: managed-workspace-evidence
          path: |
            qa/managed-*.png
            qa/managed-browser-evidence.json
            qa/requests-*.png
            qa/requests-browser-evidence.json
            qa/solution-visual-*.png
            qa/solution-visual-browser-evidence.json
            qa/solution-handoff-*.png
          retention-days: 7
          if-no-files-found: error
